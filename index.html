
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silent Please | Noise Alert System</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
    min-height: 100vh;
    padding: 25px 15px;
}

.container {
    max-width: 650px;
    margin: 35px auto;
    background: #1e293b;
    padding: 30px 20px;
    border-radius: 20px;
    box-shadow: 0 10px 35px #0005;
}

h1 {
    font-size: 35px;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 35px;
}

.level {
    font-size: 65px;
    font-weight: bold;
    margin: 15px;
    color: #4ade80;
}

.unit {
    font-size: 20px;
}

.meter {
    height: 18px;
    background: #334155;
    border-radius: 20px;
    overflow: hidden;
    margin: 25px 0;
}

.meter-fill {
    height: 100%;
    width: 0%;
    background: #4ade80;
    transition: width 0.15s;
}

.status {
    padding: 25px 10px;
    border-radius: 12px;
    background: #14532d;
    color: #86efac;
    font-size: 25px;
    font-weight: bold;
    margin: 25px 0;
}

.warning {
    background: #991b1b;
    color: white;
    animation: blink 0.8s infinite alternate;
}

@keyframes blink {
    from { opacity: 1; }
    to { opacity: 0.65; }
}

button {
    padding: 14px 25px;
    margin: 8px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.start {
    background: #22c55e;
    color: #052e16;
}

.stop {
    background: #ef4444;
    color: white;
}

.settings {
    margin-top: 25px;
    color: #cbd5e1;
}

input[type="range"] {
    width: 80%;
    margin: 15px;
}

.note {
    color: #94a3b8;
    font-size: 12px;
    line-height: 1.6;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <h1> SILENT PLEASE </h1>
    <p class="subtitle">SMART NOISE ALERT SYSTEM</p>

    <p>LIVE NOISE LEVEL</p>

    <div class="level">
        <span id="noise">--</span>
        <span class="unit">dB</span>
    </div>

    <div class="meter">
        <div class="meter-fill" id="meter"></div>
    </div>

    <div class="status" id="status">
        SYSTEM NOT STARTED
    </div>

    <button class="start" onclick="startMonitoring()">
        START MONITORING
    </button>

    <button class="stop" onclick="stopMonitoring()">
        STOP MONITORING
    </button>

    <div class="settings">
        <p>ALERT THRESHOLD: 
            <strong><span id="thresholdValue">45</span> dB</strong>
        </p>

        <input type="range"
               id="threshold"
               min="30"
               max="90"
               value="45"
               oninput="updateThreshold()">
    </div>

    <p class="note">
        Please allow microphone access when requested.
        The microphone processes sound locally in your browser.
        This is an approximate, uncalibrated sound-level estimate.
    </p>

</div>

<script>

let audioContext;
let analyser;
let microphone;
let animationId;
let stream;
let isMonitoring = false;
let alertActive = false;
let lastAlertTime = 0;

let threshold = 45;

// Calibration offset: must be adjusted using a sound meter.
const calibrationOffset = 90;

// Update threshold
function updateThreshold() {
    threshold = Number(
        document.getElementById("threshold").value
    );

    document.getElementById("thresholdValue")
        .textContent = threshold;
}

// Start monitoring
async function startMonitoring() {

    if (isMonitoring) return;

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            }
        });

        audioContext = new AudioContext();

        await audioContext.resume();

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;

        microphone = audioContext.createMediaStreamSource(stream);

        microphone.connect(analyser);

        isMonitoring = true;
        alertActive = false;

        document.getElementById("status").textContent =
            "MONITORING STARTED";

        monitorNoise();

    } catch (error) {

        alert("Microphone access failed. Please allow microphone permission and try again.");

        console.error(error);

    }
}

// Measure noise
function monitorNoise() {

    if (!isMonitoring) return;

    const data = new Float32Array(analyser.fftSize);

    analyser.getFloatTimeDomainData(data);

    let sum = 0;

    for (let i = 0; i < data.length; i++) {
        sum += data[i] * data[i];
    }

    const rms = Math.sqrt(sum / data.length);

    const dbFS = 20 * Math.log10(Math.max(rms, 0.000001));

    // Approximate level, not calibrated dB SPL
    const noiseLevel = Math.max(
        0,
        Math.round(dbFS + calibrationOffset)
    );

    document.getElementById("noise").textContent = noiseLevel;

    document.getElementById("meter").style.width =
        Math.min(noiseLevel, 100) + "%";

    const status = document.getElementById("status");

    if (noiseLevel > threshold) {

        status.textContent = "SILENT PLEASE!";

        status.classList.add("warning");

        // Speak once, then wait until sound drops
        // below the threshold before another alert.
        const now = Date.now();

        if (!alertActive && now - lastAlertTime > 3000) {

            alertActive = true;
            lastAlertTime = now;

            speakAlert();
        }

    } else {

        status.textContent = "QUIET ENVIRONMENT";

        status.classList.remove("warning");

        // Hysteresis prevents repeated alerts near 45.
        if (noiseLevel < threshold - 2) {
            alertActive = false;
        }

    }

    animationId = requestAnimationFrame(monitorNoise);
}

// Voice announcement
function speakAlert() {

    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const message = new SpeechSynthesisUtterance(
        "Silent Please. Please maintain silence."
    );

    message.lang = "en-IN";
    message.rate = 0.9;
    message.pitch = 1;
    message.volume = 1;

    window.speechSynthesis.speak(message);
}

// Stop monitoring
function stopMonitoring() {

    isMonitoring = false;

    cancelAnimationFrame(animationId);

    window.speechSynthesis.cancel();

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    if (audioContext && audioContext.state !== "closed") {
        audioContext.close();
    }

    document.getElementById("noise").textContent = "--";

    document.getElementById("meter").style.width = "0%";

    const status = document.getElementById("status");

    status.textContent = "MONITORING STOPPED";
    status.classList.remove("warning");

    alertActive = false;
}

</script>

</body>
</html>
